name: Folo Rust Core CI and release

on:
  push:
    branches: [main]
    tags: ['rust*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folo-rust-core-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.96.0

jobs:
  rust:
    name: Rust ABI and boundary audit
    runs-on: macos-14
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Select pinned Rust toolchain
        run: rustup default "$RUST_TOOLCHAIN"

      - name: Select the Xcode toolchain
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.4.1.app
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version

      - name: Verify Rust-only source boundary and source lock
        run: |
          ruby scripts/check_rust_core_boundary.rb
          ruby scripts/verify_xray_rust_source_lock.rb

      - name: Run Rust FFI tests
        working-directory: xray-rust-eval
        run: cargo test --locked -p xray-ffi --all-targets

      - name: Verify Rust dependency audit
        run: |
          ruby scripts/generate_xray_rust_dependency_sbom.rb --source-commit "$(git log -1 --format=%H -- xray-rust-eval)"
          ruby scripts/check_xray_rust_license_audit.rb

  go-oracles:
    name: Test-only Go oracle fixtures
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Go toolchain for fixtures only
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: xray-rust-eval/go.sum

      - name: Verify oracle fixtures
        working-directory: xray-rust-eval
        run: scripts/verify-oracle-fixtures.sh

  release:
    name: Build, sign and publish Rust Core artifact
    needs: [rust, go-oracles]
    if: startsWith(github.ref, 'refs/tags/rust')
    runs-on: macos-14
    environment: PublicCoreRelease
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Select pinned Rust toolchain and Xcode
        run: |
          set -euo pipefail
          rustup default "$RUST_TOOLCHAIN"
          test -d /Applications/Xcode_26.4.1.app
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer

      - name: Build and verify Rust XCFramework
        run: FOLO_XRAY_RUST_TOOLCHAIN="$RUST_TOOLCHAIN" ./build/build_rust_xcframework.sh

      - name: Package release bundle
        id: bundle
        env:
          SOURCE_URL: https://github.com/Jannerzhang/folo-xray-apple
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          framework="artifacts/xcframework/${revision}/XrayRust.xcframework"
          test -d "$framework"
          archive="$RUNNER_TEMP/XrayRust.xcframework.zip"
          ditto -c -k --keepParent "$framework" "$archive"
          output="$RUNNER_TEMP/folo-rust-core-release"
          ruby scripts/generate_release_bundle.rb \
            --artifact "$archive" \
            --output "$output" \
            --core-tag "$GITHUB_REF_NAME" \
            --source-url "$SOURCE_URL" \
            --source-offer-url "$SOURCE_URL/releases/tag/$GITHUB_REF_NAME" \
            --release-ready
          cp "artifacts/xcframework/${revision}/artifact-manifest.yml" "$output/artifact-manifest.yml"
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Sign artifact and compliance records
        env:
          FOLO_CORE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.FOLO_CORE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$FOLO_CORE_SIGNING_PRIVATE_KEY_B64"
          key="$RUNNER_TEMP/folo-rust-core-signing.pem"
          printf '%s' "$FOLO_CORE_SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$key"
          ruby scripts/sign_release_artifact.rb \
            --artifact "${{ steps.bundle.outputs.output }}/XrayRust.xcframework.zip" \
            --private-key "$key" \
            --signature "${{ steps.bundle.outputs.output }}/XrayRust.xcframework.zip.sig"
          rm -f "$key"

      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folo-rust-core-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            ${{ steps.bundle.outputs.output }}/XrayRust.xcframework.zip
            ${{ steps.bundle.outputs.output }}/XrayRust.xcframework.zip.sig
            ${{ steps.bundle.outputs.output }}/release-manifest.json
            ${{ steps.bundle.outputs.output }}/sbom.spdx.json
            ${{ steps.bundle.outputs.output }}/THIRD_PARTY_NOTICES.md
            ${{ steps.bundle.outputs.output }}/artifact-manifest.yml

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.bundle.outputs.output }}/XrayRust.xcframework.zip
            ${{ steps.bundle.outputs.output }}/XrayRust.xcframework.zip.sig
            ${{ steps.bundle.outputs.output }}/release-manifest.json
            ${{ steps.bundle.outputs.output }}/sbom.spdx.json
            ${{ steps.bundle.outputs.output }}/THIRD_PARTY_NOTICES.md
            ${{ steps.bundle.outputs.output }}/artifact-manifest.yml
