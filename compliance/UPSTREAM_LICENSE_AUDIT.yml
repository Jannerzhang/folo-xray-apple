observations:
  - The pristine Xray v1.8.24 module graph contained GPL-3.0 sing dependencies.
  - Patch 0001 removes those imports and the corresponding first-release source paths.
  - The current import-closure scan reports only MIT, BSD, Apache-2.0 and MPL-2.0 components, including the public Apple wrapper.
  - The XCFramework artifact manifest records the fixed toolchain, slices, system link frameworks and exported-symbol allowlist.
  - The stage-09 Folo distro closure is 389 packages; stage 10 is 390 after adding the MPL-2.0 PacketFlow framing endpoint. Both exclude generic infra/conf, local listener workers, API/command, observatory and legacy proxy/transport packages.
  - The stage-09 configuration boundary is main/folojson; the mobile wrapper accepts only the versioned VLESS/TCP/Reality schema.
  - Stage 10 adds the MPL-2.0 main/folotun framing endpoint and a private Swift PacketFlow bridge PoC; this does not add a local listener or a new third-party protocol implementation.
  - The framework remains local-only and releaseReady=false until the source offer and later Packet Tunnel gates are complete.
