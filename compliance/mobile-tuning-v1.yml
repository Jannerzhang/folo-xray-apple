# SPDX-License-Identifier: Apache-2.0
schemaVersion: 2
profile: folo-ios-rust-core-v2
status: local-only
limits:
  maxConfigBytes: 4194304
  maxOutboundCount: 1
  maxInboundCount: 0
  maxEngineInstances: 1
  packetFlowMaxPacketBytes: 65535
  packetFlowMaxBatch: 64
defaults:
  mode: tun
  transport: tcp
  security: reality
  vlessFlow: xtls-rprx-vision
  vlessEncryption: none
  statistics: enabled
  logs: disabled-by-default
  allowInsecure: false
resourceBudget:
  measurementUnit: bytes
  budgetIs: hard review gate, not a fixed iOS process quota
  runtimeMemoryTargetBytes: 15728640
  runtimeMemoryEscalationBytes: 25165824
  measurement: peak Packet Tunnel resident memory during a 15-minute TCP/Reality soak
changeControl:
  configLimitOwner: xray-rust-eval/crates/xray-ffi
  schemaLimitOwner: xray-rust-eval/crates/xray-config
  instanceLimitOwner: xray-rust-eval/crates/xray-runtime
