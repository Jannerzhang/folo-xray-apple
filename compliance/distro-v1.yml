# SPDX-License-Identifier: Apache-2.0
schemaVersion: 2
profile: folo-ios-rust-managed-protocols
status: local-only
purpose: >-
  Contract for the Rust Core configuration subset consumed by the private iOS
  client. The host owns the Packet Tunnel flow and the core exposes no local
  proxy listener or generic command server.
configBoundary:
  loader: xray-rust-eval/crates/xray-config
  format: versioned-folo-json
  genericXrayJson: forbidden
  privateAppleApis: forbidden
runtimeFeatures:
  - id: rust-ffi
    package: xray-rust-eval/crates/xray-ffi
    role: ABI v2 lifecycle, packet IO, statistics and bounded diagnostics
  - id: routing
    package: xray-rust-eval/crates/xray-routing
    role: versioned route projection and DNS attribution policy
  - id: tun
    package: xray-rust-eval/crates/xray-tun
    role: Rust TUN packet runtime without a host-owned listener
excluded:
  - Go/cgo runtime and gVisor netstack
  - generic local proxy listeners
  - private utun descriptor enumeration
  - arbitrary command/API server
  - raw profile credentials in the FFI handoff
restorePolicy:
  rule: >-
    Restore only through a new Rust schema, ABI and dependency audit. Do not
    restore the retired Go wrapper or old FoloXray symbols.
  requiredRecords:
    - source lock and Cargo.lock update
    - ABI/header/module-map verification
    - dependency SBOM and license audit
    - Rust runtime and device budget evidence
